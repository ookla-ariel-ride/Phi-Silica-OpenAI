name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # A Windows host is required: src/NpuBridge targets net10.0-windows and runs the CsWinRT
    # projection step. The x64 runner cross-builds the win-arm64 exe. The tests target plain net10.0
    # and run against FakeBackend only, so no NPU, package identity or Windows App Runtime is needed.
    # Debug configuration on purpose: it is what `dotnet build` / `dotnet test` produce locally, and
    # identity.ps1 and smoke.ps1 pick the newest build output, so CI should not introduce a second one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
